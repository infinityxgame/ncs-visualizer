<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NCS Visualizer + Dynamic Fireflies</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background: transparent;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            object-fit: contain;
        }

        #btn-captura {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            padding: 15px 30px;
            background: #fff;
            border: none;
            border-radius: 4px;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #btn-captura:hover { transform: translate(-50%, -50%) scale(1.05); }

        .firefly-container {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

<canvas id="visualizer"></canvas>
<button id="btn-captura">Sincronizar Audio de mi PC</button>

<div class="firefly-container">

</div>

<div class="firefly-container" id="dynamic-fireflies">
</div>

<script src="renderer.js"></script>
<script src="shader.js"></script>
<script>
    const canvas = document.getElementById("visualizer");
    const btn = document.getElementById("btn-captura");
    const dynamicContainer = document.getElementById("dynamic-fireflies");

    let audioCtx, analyser, dataArray, bufferLength;
    let amplitudes = [];
    let fgColor = [1, 0, 0];

    // Ajustar resolucion del canvas
    function updateResolution(c) {
        const clientSize = Math.min(c.clientWidth, c.clientHeight);
        const screenSize = Math.round(clientSize * window.devicePixelRatio);
        if (c.width !== screenSize || c.height !== screenSize) {
            c.width = c.height = screenSize;
        }
    }

    const ctx = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: false });

    if (!ctx) {
        alert("WebGL2 no es soportado en este navegador.");
    }

    const state = rendererInit(ctx);
    updateResolution(canvas);
    rendererResize(ctx, state);

    let lastAmplitude = 0;
    let timer = 0;
    let lastTime = 0;

    btn.addEventListener("click", async () => {
        try {
            // 1. Pedir capture de pantalla (lo que permita al usuario elegir)
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: true
            });

            // 2. Obtener el track de audio del stream
            const audioTracks = stream.getAudioTracks();
            let finalStream = stream;

            if (audioTracks.length === 0) {
                // Fallback a microfono si no hubo audio en la captura
                const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                finalStream = micStream;
            }

            btn.style.display = "none";

            // 3. Crear AudioContext y conectar el stream
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.0;

            const source = audioCtx.createMediaStreamSource(finalStream);
            source.connect(analyser);

            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            // Loop de audio para calcular amplitudes
            function updateAudio() {
                if (!analyser) return;
                analyser.getByteFrequencyData(dataArray);

                // Calculamos amplitud promedio de todas las frecuencias
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                const avg = sum / dataArray.length;
                // Normalizamos a un valor entre 0 y 1 (multiplicamos por 1.8 como en el codigo original)
                const amplitude = Math.min((avg / 255) * 1.8, 1.0);

                const now = performance.now();
                amplitudes.push([amplitude, now]);
                // Keep last 10 samples
                if (amplitudes.length > 10) {
                    amplitudes.splice(0, amplitudes.length - 10);
                }

                // Efecto firefly basado en el bajo
                let bass = 0;
                const bassSamples = Math.min(10, dataArray.length);
                for (let i = 0; i < bassSamples; i++) bass += dataArray[i];
                bass = bass / bassSamples;
                let opacityValue = Math.min(bass / 255, 1);
                dynamicContainer.style.opacity = opacityValue;
            }

            function loopAudio() {
                updateAudio();
                requestAnimationFrame(loopAudio);
            }
            loopAudio();

        } catch (err) {
            console.error(err);
            alert("Para que funcione debes aceptar compartir la pantalla y activar 'Compartir audio del sistema'.");
        }
    });

    const render = time => {
        const dt = (time - lastTime) / 1000;
        lastTime = time;
        timer += dt;

        let target = 0;

        // Usamos un sistema de suavizado mas simple y directo
        if (amplitudes.length > 0) {
            // Tomamos el promedio de las ultimas amplitudes para un movimiento mas estable
            const sum = amplitudes.reduce((acc, val) => acc + val[0], 0);
            target = sum / amplitudes.length;
        }

        target = Math.min(Math.max(target, 0), 1);
        if (isNaN(target)) target = lastAmplitude;

        const easing = target > lastAmplitude ? 0.85 : 0.3;
        const amplitude = lastAmplitude + (target - lastAmplitude) * easing;
        lastAmplitude = amplitude;

        rendererRender(
            ctx,
            state,
            fgColor,
            time,
            amplitude,
            0.8,  // sphereSize: Tamaño general equilibrado
            0.3,  // sphereSizeVariation: Cuánto crece el círculo completo con el bajo (55% más)
            0.22,  // noiseAmplitude: Ondas sutiles y elegantes en los bordes como el original
            8.5,   // noiseFrequency
            180,   // dotCount
            1      // dotSize
        );

        requestAnimationFrame(render);
    };
    requestAnimationFrame(render);

    const resizeObserver = new ResizeObserver(() => {
        updateResolution(canvas);
        rendererResize(ctx, state);
    });
    resizeObserver.observe(canvas);
</script>

</body>
</html>

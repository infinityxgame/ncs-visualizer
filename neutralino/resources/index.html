<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NCS Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background: transparent;
            -webkit-app-region: drag;
            user-select: none;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            object-fit: contain;
        }

        button, input, #btn-captura, #btn-close, #color-picker-btn {
            -webkit-app-region: no-drag;
        }

        #btn-captura {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            padding: 15px 30px;
            background: #fff;
            border: none;
            border-radius: 4px;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #btn-captura:hover { transform: translate(-50%, -50%) scale(1.05); }

        #btn-close {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 30;
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
        }
        #btn-close.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #btn-close:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: #fff;
            transform: scale(1.1);
        }

        #color-picker {
            display: none;
        }

        #color-picker-btn {
            position: absolute;
            top: 10px;
            right: 50px;
            z-index: 30;
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
        }
        #color-picker-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #color-picker-btn:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: #fff;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<canvas id="visualizer"></canvas>
<button id="btn-captura">Sync audio from my PC</button>
<button id="color-picker-btn">🎨</button>
<input type="color" id="color-picker" value="#ff0000">
<button id="btn-close">×</button>

<script src="renderer.js"></script>
<script src="shader.js"></script>
<script src="js/neutralino.js"></script>
<script>
    // Inicializar Neutralino si está disponible
    if (window.Neutralino) {
        Neutralino.init();

        // Mover la ventana manteniendo presionado el clic izquierdo en la pantalla
        let isDragging = false;
        let initialMouseX = 0, initialMouseY = 0;
        let initialWinX = 0, initialWinY = 0;

        document.addEventListener('mousedown', async (e) => {
            if (e.button === 0 && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                isDragging = true;
                initialMouseX = e.screenX;
                initialMouseY = e.screenY;
                try {
                    const pos = await Neutralino.window.getPosition();
                    initialWinX = pos.x;
                    initialWinY = pos.y;
                } catch (err) {}
            }
        });

        window.addEventListener('mousemove', async (e) => {
            if (isDragging) {
                const deltaX = e.screenX - initialMouseX;
                const deltaY = e.screenY - initialMouseY;
                try {
                    await Neutralino.window.move(
                        initialWinX + deltaX,
                        initialWinY + deltaY
                    );
                } catch (err) {}
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });
    }

    const canvas = document.getElementById("visualizer");
    const btn = document.getElementById("btn-captura");
    const btnClose = document.getElementById("btn-close");
    const colorPickerBtn = document.getElementById("color-picker-btn");
    const colorPicker = document.getElementById("color-picker");

    function closeApp() {
        if (window.Neutralino) {
            Neutralino.app.exit();
        } else if (window.electronAPI) {
            window.electronAPI.closeWindow();
        } else {
            window.close();
        }
    }

    btnClose.addEventListener("click", closeApp);

    document.body.addEventListener("mouseenter", () => {
        btnClose.classList.add("visible");
        colorPickerBtn.classList.add("visible");
    });

    document.body.addEventListener("mouseleave", () => {
        btnClose.classList.remove("visible");
        colorPickerBtn.classList.remove("visible");
    });

    colorPickerBtn.addEventListener("click", () => {
        colorPicker.click();
    });

    colorPicker.addEventListener("input", (e) => {
        const hex = e.target.value;
        const r = parseInt(hex.slice(1, 3), 16) / 255;
        const g = parseInt(hex.slice(3, 5), 16) / 255;
        const b = parseInt(hex.slice(5, 7), 16) / 255;
        fgColor = [r, g, b];
    });

    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
            closeApp();
        }
    });

    let audioCtx, analyser, dataArray, bufferLength;
    let amplitudes = [];
    let fgColor = [1, 0, 0];

    function updateResolution(c) {
        const clientSize = Math.min(c.clientWidth, c.clientHeight);
        const screenSize = Math.round(clientSize * window.devicePixelRatio * 0.7);
        if (c.width !== screenSize || c.height !== screenSize) {
            c.width = c.height = screenSize;
        }
    }

    const ctx = canvas.getContext("webgl2", {
        alpha: true,
        premultipliedAlpha: false,
        preserveDrawingBuffer: true,
        antialias: false
    });

    if (!ctx) {
        alert("WebGL2 is not supported in this browser.");
    }

    const state = rendererInit(ctx);
    updateResolution(canvas);
    rendererResize(ctx, state);

    let lastAmplitude = 0;
    let timer = 0;
    let lastTime = 0;

    btn.addEventListener("click", async () => {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: true
            });

            const audioTracks = stream.getAudioTracks();
            let finalStream = stream;

            if (audioTracks.length === 0) {
                const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                finalStream = micStream;
            }

            btn.style.display = "none";

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 128;
            analyser.smoothingTimeConstant = 0.0;

            const source = audioCtx.createMediaStreamSource(finalStream);
            source.connect(analyser);

            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            function updateAudio() {
                if (!analyser) return;
                analyser.getByteFrequencyData(dataArray);

                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                const avg = sum / dataArray.length;

                const amplitude = Math.min((avg / 255) * 1.8, 1.0);

                const now = performance.now();
                amplitudes.push([amplitude, now]);
                
                if (amplitudes.length > 10) {
                    amplitudes.splice(0, amplitudes.length - 10);
                }
            }

            function loopAudio() {
                updateAudio();
                requestAnimationFrame(loopAudio);
            }
            loopAudio();

        } catch (err) {
            console.error(err);
            alert("For it to work, you must accept screen sharing and activate 'System audio sharing'.");
        }
    });

    const render = time => {
        const dt = (time - lastTime) / 1000;
        lastTime = time;
        timer += dt;

        let target = 0;

        if (amplitudes.length > 0) {
            const sum = amplitudes.reduce((acc, val) => acc + val[0], 0);
            target = sum / amplitudes.length;
        }

        target = Math.min(Math.max(target, 0), 1);
        if (isNaN(target)) target = lastAmplitude;

        const easing = target > lastAmplitude ? 0.85 : 0.3;
        const amplitude = lastAmplitude + (target - lastAmplitude) * easing;
        const minAmplitude = 0.2;
        const finalAmplitude = Math.max(amplitude, minAmplitude);
        lastAmplitude = finalAmplitude;

        rendererRender(
            ctx,
            state,
            fgColor,
            time,
            finalAmplitude,
            0.7,
            0.3,
            0.22,
            6,
            150,
            1
        );

        requestAnimationFrame(render);
    };
    requestAnimationFrame(render);

    const resizeObserver = new ResizeObserver(() => {
        updateResolution(canvas);
        rendererResize(ctx, state);
    });
    resizeObserver.observe(canvas);
</script>

</body>
</html>
